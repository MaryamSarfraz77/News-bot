name: Run News Pipeline (Scheduled)

# Vercel Hobby cron only allows once/day, so this workflow replaces
# vercel.json's crons block. It just makes an HTTP request to the
# already-deployed /api/run endpoint on Vercel — it does NOT run the
# Python pipeline inside GitHub Actions itself.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   VERCEL_APP_URL   e.g. https://your-project.vercel.app
#   CRON_SECRET      same value as the CRON_SECRET env var set on Vercel

on:
  schedule:
    # Every 6 hours, UTC. GitHub may delay a few minutes under load —
    # that's normal and fine for this use case.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/run on Vercel
        run: |
          curl --fail --show-error --silent \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/run"
